name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python for numerical parity tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test numerical calculations and related features
        run: |
          npm run test:numerical-calculation
          npm run test:upper-air
          npm run test:cloud-classification

      - name: Test disaster quiz catalog
        run: npm run test:quiz

      - name: Test current-location marker controls
        run: npm run test:location

      - name: Test historical earthquake search and request cancellation
        run: |
          node Tests/EarthquakeHistoryProxyTests.mjs
          node Tests/EarthquakeHistoryTests.mjs
          npm run test:resilience

      - name: Test responsive layouts
        run: npm run test:responsive

      - name: Test in-app changelog
        run: npm run test:changelog

      - name: Test map date formatting
        run: npm run test:map-date-formatters

      - name: Test initial map loading gates
        run: npm run test:startup

      - name: Test legal consent gates
        run: npm run test:consent

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          VITE_EARTHQUAKE_API_BASE: "https://meteoscope.pages.dev/api/earthquakes"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
