name: Update earthquake history data

on:
  schedule:
    # 03:30 JST. The archive intentionally lags two days to allow JMA publication.
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earthquake-history-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore immutable JMA source cache
        id: jma-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/jma-earthquake-history
          key: jma-earthquake-history-v1-${{ runner.os }}-${{ hashFiles('scripts/update-jma-earthquake-history.mjs') }}
          restore-keys: |
            jma-earthquake-history-v1-${{ runner.os }}-

      - name: Refresh the recent archive window
        run: npm run data:update:earthquake-history

      - name: Validate earthquake history
        run: npm run test:earthquake

      - name: Save immutable JMA source cache
        if: success() && steps.jma-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/jma-earthquake-history
          key: jma-earthquake-history-v1-${{ runner.os }}-${{ hashFiles('scripts/update-jma-earthquake-history.mjs') }}

      - name: Detect updated data
        id: data-changes
        run: |
          if git diff --quiet -- public/data/earthquake-history; then
            echo "No earthquake-history data changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        if: steps.data-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/earthquake-history
          git commit -m "chore(data): update earthquake history"
          git push
