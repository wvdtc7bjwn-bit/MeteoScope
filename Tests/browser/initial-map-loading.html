<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>基図の起動検証（架空データ）</title>
  <style>
    html,body { margin:0; background:#071225; color:white; font:14px system-ui; }
    #map { position:fixed; inset:0; }
    #loading { position:fixed; inset:0; background:#071225; z-index:10; display:grid; place-items:center; }
    #loading[hidden] { display:none; }
    #tools { position:fixed; bottom:12px; left:12px; right:12px; z-index:20; background:#102b45; padding:8px; border-radius:6px; }
    button { padding:8px; margin:4px; }
    #result { display:block; font-size:12px; white-space:pre-wrap; overflow-wrap:anywhere; max-height:110px; overflow:auto; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="loading">地図を読み込み中</div>
  <div id="tools">
    <strong>ローカル検証・架空の警報データ（本番情報ではありません）</strong>
    <div>
      <button id="warn">5市町を警報色にする</button>
      <button id="early">早期注意色</button>
      <button id="clear">解除</button>
      <button id="aomori">青森市にズーム</button>
      <button id="theme">ライト切替</button>
      <button id="tabs">タブ切替</button>
    </div>
    <output id="result"></output>
  </div>
  <script type="module" src="./initial-map-loading.js"></script>
</body>
</html>
