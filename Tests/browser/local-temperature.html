<!doctype html>
<html lang="ja" data-theme="dark">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/src/style.css">
<title>Local temperature regression checks (synthetic data)</title>
<style>body{padding:16px}#local-temperature-summary{display:flex}main>button{padding:10px;margin:4px}#checks{white-space:pre-wrap}</style>
<main>
  <button id="run">Run regression checks</button>
  <button id="theme">Light / dark</button>
  <button id="language">English</button>
  <button id="japanese">日本語</button>
  <button id="weather">Wind detail example</button>
  <p id="checks" role="status">Synthetic inputs only. No GPS or estimation requests.</p>
  <section id="local-temperature-summary"></section>
  <p id="font-reference" class="mobile-dock-amedas-nearest amedas-observation-value">12.6℃</p>
</main>
<script>
// Keep fixture language and consent preferences separate from the running app.
{
  const values = new Map();
  Object.defineProperty(window, "localStorage", { configurable: true, value: {
    getItem: key => values.get(String(key)) ?? null,
    setItem: (key, value) => values.set(String(key), String(value)),
    removeItem: key => values.delete(String(key)), clear: () => values.clear(),
    key: index => [...values.keys()][index] ?? null, get length() { return values.size; }
  }});
}
</script>
<script type="module" src="./local-temperature.js"></script>
</html>
