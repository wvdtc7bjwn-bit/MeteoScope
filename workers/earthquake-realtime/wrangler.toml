name = "meteoscope-earthquake-realtime"
main = "src/index.js"
compatibility_date = "2026-07-15"

[triggers]
# The 1-minute trigger receives today's and yesterday's earthquake XML updates,
# prunes older XML rows, and backfills at most one missing daily-list date.
# Daily-list completion is cached per source date for six hours.
crons = ["* * * * *"]

# Delete the retired realtime-ingestion Durable Object class and its stored instances when
# this Worker revision is deployed. No Durable Object binding remains.
[[migrations]]
tag = "v2"
deleted_classes = ["MeteoScopeEarthquakeHub"]

[[d1_databases]]
binding = "EQ_D1"
database_name = "meteoscope-earthquakes"
database_id = "3528edad-c190-42d7-8130-e82007abc14e"
