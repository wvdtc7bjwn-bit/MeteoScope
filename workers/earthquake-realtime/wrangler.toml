name = "meteoscope-earthquake-realtime"
main = "src/index.js"
compatibility_date = "2026-07-15"

[triggers]
# Keep real-time XML ingestion and Discord delivery isolated from the heavier
# daily-list maintenance so one job cannot exhaust the other's CPU budget.
# The first trigger handles today's and yesterday's earthquake XML every minute.
# The second backfills at most one missing daily-list date once per hour.
crons = ["* * * * *", "17 * * * *"]

# Discord earthquake notifications are enabled only when this Worker has the
# DISCORD_EARTHQUAKE_WEBHOOK_URL secret. Never place the webhook URL in this file.
[secrets]
required = ["DISCORD_EARTHQUAKE_WEBHOOK_URL"]

# Delete the retired realtime-ingestion Durable Object class and its stored instances when
# this Worker revision is deployed. No Durable Object binding remains.
[[migrations]]
tag = "v2"
deleted_classes = ["MeteoScopeEarthquakeHub"]

[[d1_databases]]
binding = "EQ_D1"
database_name = "meteoscope-earthquakes"
database_id = "3528edad-c190-42d7-8130-e82007abc14e"
