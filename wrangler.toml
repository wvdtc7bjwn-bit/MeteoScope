name = "meteoscope"
compatibility_date = "2026-07-06"
pages_build_output_dir = "dist"

[vars]
CLOUDFLARE_ACCOUNT_ID = "2a2eb25e3aa9744a586a8fa1165f6724"
QUIZ_ATTEMPT_RETENTION_DAYS = "15"
QUIZ_LEADERBOARD_CACHE_SECONDS = "60"
# Workers Free verified in the dashboard on 2026-11-13. Keep this account Free;
# the API also reserves daily AI usage and enforces each account's question limit.
WARNING_CHAT_ENABLED = "true"
WARNING_CHAT_DAILY_LIMIT = "none"

[ai]
binding = "AI"

[[d1_databases]]
binding = "NOTIFICATIONS_DB"
database_name = "meteoscope-notifications"
database_id = "c1552aac-5617-4ed0-bf69-548a44ef363e"

[[services]]
binding = "HYPOCENTER_ARCHIVE"
service = "meteoscope-earthquake-realtime"
